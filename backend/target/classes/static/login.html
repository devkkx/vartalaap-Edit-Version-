<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login - Vartalaap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="./vlogo.jpeg" />
    <link rel="shortcut icon" type="image/jpeg" href="./vlogo.jpeg" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #2cbcdc;
        overflow-x: hidden;
      }

      /* CONTAINER */
      .container {
        display: flex;
        flex: 1 0 auto;
        width: 100%;
        min-height: calc(100vh - 65px);
      }

      /* LEFT */
      .left {
        flex: 1.2;
        position: relative;
        overflow: hidden;
        background: #df78e7;
        min-height: 320px;
      }

      .left img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        position: absolute;
        top: 0;
        left: 0;
      }

      /* OVERLAY */
      .left::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.35);
        top: 0;
        left: 0;
      }

      /* 🔥 SAME BOUNCE */
      @keyframes bounceIn {
        0% {
          transform: translate(-50%, -140px) scale(0.85);
          opacity: 0;
        }
        20% {
          transform: translate(-50%, 40px) scale(1.08);
          opacity: 1;
        }
        35% {
          transform: translate(-50%, -20px) scale(0.95);
        }
        50% {
          transform: translate(-50%, 15px) scale(1.02);
        }
        65% {
          transform: translate(-50%, -8px) scale(0.98);
        }
        80% {
          transform: translate(-50%, 4px) scale(1.01);
        }
        100% {
          transform: translate(-50%, 0) scale(1);
        }
      }

      /* TITLE */
      .brand {
        font-family: cursive;
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-size: 38px;
        font-weight: bold;
        letter-spacing: 2px;
        z-index: 2;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        animation: bounceIn 2s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* RIGHT */
      .right {
        flex: 0.8;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #2cbcdc;
        padding: 20px 24px;
        overflow-y: auto;
      }

      /* CARD */
      .card {
        width: 100%;
        max-width: 370px;
        background: white;
        padding: 24px 28px;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        text-align: center;
        transition: 0.3s;
        margin: auto;
      }

      .card:hover {
        transform: translateY(-2px);
      }

      /* LOGO */
      .logo img {
        width: 85px;
        height: auto;
        border-radius: 50%;
        margin-bottom: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      }

      /* INPUT */
      input {
        width: 100%;
        padding: 10px 12px;
        margin-top: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        transition: 0.2s;
        font-size: 14px;
      }

      input:focus {
        border-color: #118ab2;
        box-shadow: 0 0 5px rgba(17, 138, 178, 0.3);
      }

      /* BUTTON */
      button {
        width: 100%;
        padding: 11px 14px;
        margin-top: 14px;
        border: none;
        background: linear-gradient(135deg, #2cbcdc, #0f6f91);
        color: white;
        font-size: 15px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.02);
      }

      /* LINK */
      .link {
        margin-top: 12px;
        font-size: 13px;
      }

      .link a {
        color: #118ab2;
        text-decoration: none;
        font-weight: 600;
      }

      .link a:hover {
        text-decoration: underline;
      }

      /* ERROR */
      .error {
        color: red;
        font-size: 13px;
        margin-top: 8px;
      }

      /* FOOTER */
      .footer {
        flex-shrink: 0;
        width: 100%;
        text-align: center;
        padding: 10px 16px;
        background: linear-gradient(135deg, #df78e7, #2cbcdc);
        color: white;
        font-size: 13px;
        z-index: 10;
      }

      .footer a {
        color: white;
        text-decoration: none;
        margin: 0 8px;
      }

      .footer p {
        margin-top: 4px;
        font-size: 12px;
      }

      /* =========================
   RESPONSIVE
========================= */

      @media (max-width: 850px) {
        .container {
          flex-direction: column;
          flex: 1 0 auto;
        }

        .left {
          flex: 1;
          height: auto;
          min-height: 200px;
        }

        .brand {
          font-size: 30px;
          top: 15px;
        }

        .right {
          flex: none;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 16px;
          background: #2cbcdc;
        }

        .card {
          width: 100%;
          max-width: 350px;
          padding: 20px 22px;
          margin: 0;
        }

        .logo img {
          width: 65px;
        }

        .footer {
          font-size: 12px;
          padding: 8px 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- LEFT IMAGE -->
      <div class="left">
        <h1 class="brand" style="font-family: cursive">VartAlaap</h1>
        <img src="./loginpic.png" alt="Login Image" />
      </div>

      <!-- RIGHT -->
      <div class="right">
        <div class="card">
          <div class="logo">
            <img src="./vlogo.jpeg" alt="Logo" />
          </div>

          <h2 style="font-family: cursive">Login</h2>

          <!-- FORM -->
          <form onsubmit="login(event)">
            <input id="username" placeholder="Username" required />
            <input
              id="password"
              type="password"
              placeholder="Password"
              required
            />

            <button type="submit">Login</button>
          </form>

          <script src="login.js"></script>

          <p id="error" class="error"></p>

          <p class="link">New user? <a href="register.html">Register</a></p>
        </div>
      </div>
    </div>

    <footer class="footer">
      © 2026 Vartalaap. All rights reserved.

      <br />
      <a href="help.html">Help</a> | <a href="feedback.html">Feedback</a> |
      <a href="privacy.html">Privacy</a> | <a href="terms.html">Terms</a>

      <p>
        Made by
        <a
          href="https://github.com/devkkx"
          target="_blank"
          rel="noopener noreferrer"
          >devkkx</a
        >
      </p>
    </footer>
  </body>
</html>
